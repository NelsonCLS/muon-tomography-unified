[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muon-tomography-unified"
version = "0.1.0"
description = "Unified 64^3 Mu-Net, PoCA, and likelihood muon-tomography reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "h5py>=3.11,<4",
  "PyYAML>=6,<7",
  "uproot>=5.3,<6",
  "awkward>=2.6,<3",
]

[project.optional-dependencies]
munet = ["tensorflow>=2.18,<2.22"]
plot = ["matplotlib>=3.9,<4"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
all = [
  "tensorflow>=2.18,<2.22",
  "matplotlib>=3.9,<4",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
muon-tomo = "muon_tomo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"muon_tomo._vendor.munet" = ["weights/*.h5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
