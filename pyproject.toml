[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muon-tomography-unified"
version = "0.1.0"
description = "Unified 64^3 Mu-Net, PoCA, and likelihood muon-tomography reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "LicenseRef-Mixed"
license-files = ["LICENSE", "LICENSES/*", "NOTICE", "third_party/*LICENSE"]
keywords = ["muon tomography", "reconstruction", "MuNet", "PoCA", "MLEM"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "h5py>=3.11,<4",
  "PyYAML>=6,<7",
  "uproot>=5.3,<6",
  "awkward>=2.6,<3",
]

[project.optional-dependencies]
munet = ["tensorflow>=2.18,<2.22"]
plot = ["matplotlib>=3.9,<4", "plotly>=5.24,<7"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
dev = ["build>=1.2,<2", "ruff>=0.12,<1", "twine>=6,<7"]
all = [
  "tensorflow>=2.18,<2.22",
  "matplotlib>=3.9,<4",
  "plotly>=5.24,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
muon-tomo = "muon_tomo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muon_tomo = ["configs/*.yaml"]
"muon_tomo._vendor.munet" = ["weights/*.h5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/muon_tomo/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/muon_tomo/cli.py" = ["BLE001"]
