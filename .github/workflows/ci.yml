name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install portable test dependencies
        run: python -m pip install -e ".[test,plot,dev]"
      - name: Lint
        run: ruff check src tests examples benchmarks/verify_workflows.py
      - name: Check formatting
        run: ruff format --check src tests examples benchmarks/verify_workflows.py
      - name: Dataset-free public quickstart
        run: |
          python examples/create_detector_sample.py --output "${{ runner.temp }}/demo-tracks.npz"
          muon-tomo predict --input "${{ runner.temp }}/demo-tracks.npz" --method poca --no-truth --runs-dir "${{ runner.temp }}/demo-runs"
      - name: Portable and synthetic research tests
        run: python -m pytest -q

  tfrecord:
    name: Synthetic TensorFlow adapters / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install adapter dependencies
        run: python -m pip install -e ".[test,plot,tfrecord]"
      - name: Check synthetic data round trips and no-truth workflow
        run: python -m pytest -q tests/test_simulation.py tests/test_data_contracts.py tests/test_workflow_config.py

  package:
    name: Build and install wheel outside checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install built wheel
        run: |
          python -c "from pathlib import Path; import subprocess,sys; wheel=next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[test,plot]'])"
      - name: Exercise installed entry point and packaged resources
        working-directory: ${{ runner.temp }}
        run: |
          muon-tomo --help
          muon-tomo predict --help
          python -c "from importlib.resources import files; p=files('muon_tomo'); assert (p/'configs/default.yaml').is_file(); assert (p/'_vendor/munet/weights/model_1024.weights.h5').is_file(); assert (p/'simulation/geant4/main.cc').is_file()"
      - name: Test source archive with installed package
        run: |
          mkdir -p "${{ runner.temp }}/source-release"
          tar -xzf dist/*.tar.gz -C "${{ runner.temp }}/source-release"
          cd "${{ runner.temp }}"/source-release/muon_tomography_unified-*
          python -m pytest -q
