geometry:
  shape: [64, 64, 64]
  lower_cm: [-50.0, -50.0, -50.0]
  upper_cm: [50.0, 50.0, 50.0]
  axis_order: xyz

physics:
  highland_constant_mev: 15.0
  reference_momentum_mev: 3000.0
  classical_momentum_policy: mean
  # Fixed inverse-square effective momentum derived once from funny record 0:
  # p_eff = p_ref / sqrt(E[(p_ref/p)^2]). No event-level momentum is used.
  average_momentum_mev: 1743.4601815051958

munet:
  dosage: 1024
  weights: model_1024.weights.h5
  position_scale_cm: 100.0
  position_offset: 0.5

poca:
  minimum_coverage: 1

likelihood:
  iterations: 10
  initial_inverse_radiation_length_cm_inv: 0.00004
  minimum_coverage: 1
  epsilon: 1.0e-9
  update_statistic: median
  angular_resolution_rad: 1.0e-6
  position_resolution_cm: 1.0e-3
  maximum_inverse_radiation_length_cm_inv: 20.0

calibration:
  erosion_voxels: 2
  include_background: true
  fit_intercept: true
